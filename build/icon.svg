<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Doctrine of War: Ash & Banner. The Free Banners' standard (lapis, bone hoist band, gold
       eight-pointed sun) hanging against the Ember Dusk sky, on the macOS icon grid
       (824px tile, 100px margin). Build the .icns with scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191a2c"/>
      <stop offset="0.55" stop-color="#472c3c"/>
      <stop offset="0.86" stop-color="#9a5338"/>
      <stop offset="1" stop-color="#c77347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#243f75"/>
      <stop offset="0.5" stop-color="#2f4f8f"/>
      <stop offset="1" stop-color="#26437c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf7a"/>
      <stop offset="1" stop-color="#c08f35"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- The ash horizon: a broken ridge line, low and dark. -->
    <path d="M100 842 L196 812 L262 828 L338 796 L420 820 L512 790 L604 818 L688 800 L770 826 L846 806 L924 820 L924 924 L100 924 Z" fill="#1a1414" opacity="0.9"/>
    <!-- Embers drifting up. -->
    <g fill="#ffb066">
      <circle cx="214" cy="702" r="5" opacity="0.7"/>
      <circle cx="808" cy="664" r="4" opacity="0.6"/>
      <circle cx="760" cy="742" r="3" opacity="0.5"/>
      <circle cx="268" cy="610" r="3" opacity="0.45"/>
    </g>
    <!-- Crossbar and pole. -->
    <rect x="292" y="214" width="440" height="22" rx="11" fill="#5a4030"/>
    <circle cx="292" cy="225" r="20" fill="url(#gold)"/>
    <circle cx="732" cy="225" r="20" fill="url(#gold)"/>
    <!-- The standard: lapis cloth, swallowtail foot. -->
    <path d="M330 236 H694 V748 L512 668 L330 748 Z" fill="url(#cloth)"/>
    <path d="M330 236 H694 V748 L512 668 L330 748 Z" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
    <!-- Bone hoist band. -->
    <rect x="338" y="244" width="348" height="44" fill="#e8dcc4"/>
    <!-- The gold eight-pointed sun. -->
    <g transform="translate(512 470)">
      <path fill="url(#gold)" d="M0 -150 L30 -58 L106 -106 L66 -26 L150 0 L66 26 L106 106 L30 58 L0 150 L-30 58 L-106 106 L-66 26 L-150 0 L-66 -26 L-106 -106 L-30 -58 Z"/>
      <circle r="44" fill="#2f4f8f"/>
      <circle r="28" fill="url(#gold)"/>
    </g>
  </g>
  <!-- A thin gold rim, as the UI's hairlines. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#d4a64a" stroke-opacity="0.45" stroke-width="8"/>
</svg>
